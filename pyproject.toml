[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-career-profiler"
version = "1.0.0"
description = "Privacy-first dual-engine local AI CV analyzer, ATS matcher, and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "python-multipart==0.0.9",
    "streamlit==1.32.2",
    "requests==2.31.0",
    "pydantic==2.6.4",
    "langchain-ollama==0.1.0",
    "langchain-huggingface==0.0.3",
    "langchain-chroma==0.1.2",
    "langchain-core==0.3.86",
    "sentence-transformers==3.0.1",
    "chromadb==0.5.0",
    "mcp==0.8.0",
    "PyMuPDF==1.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "flake8==7.1.1",
    "ruff==0.8.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main", "seed_db"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
