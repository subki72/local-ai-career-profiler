name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint (Flake8 & Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: pip install flake8==7.1.1 ruff==0.8.0

      - name: Run Flake8 and Ruff Checks
        run: |
          flake8 --max-line-length=120 .
          ruff check src tests main.py seed_db.py

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Offline Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.110.0 \
            uvicorn==0.29.0 \
            python-multipart==0.0.9 \
            pydantic==2.6.4 \
            requests==2.31.0 \
            PyMuPDF==1.24.0 \
            langchain-core==0.2.10 \
            httpx==0.27.2 \
            pytest==8.3.4 \
            pytest-cov==6.0.0

      - name: Run Pytest with Coverage Gate
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=40

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t cv-nexus:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cv-nexus:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
